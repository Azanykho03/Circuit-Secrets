    <radialGradient id="core-glow"><stop stop-color="#f1c6ff"/><stop offset=".45" stop-color="#a667d4"/><stop offset="1" stop-color="#482b71"/></radialGradient>
    <radialGradient id="canopy"><stop stop-color="#60835c"/><stop offset=".65" stop-color="#3c684e"/><stop offset="1" stop-color="#254941"/></radialGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="speckle" width="37" height="31" patternUnits="userSpaceOnUse"><circle cx="7" cy="8" r="1" fill="#9ab98b" opacity=".2"/><circle cx="25" cy="23" r="1.5" fill="#668b77" opacity=".3"/><path d="M32 4l3-2M12 25l2 3" stroke="#9ba979" stroke-width="1" opacity=".22"/></pattern>
