<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="667" viewBox="0 0 1000 667" role="img" aria-labelledby="title desc">
  <title id="title">Computer engineering campus</title>
  <desc id="desc">A hand-drawn game map with ten connected laboratory buildings, trees, footpaths and campus equipment.</desc>
  <defs>
    <linearGradient id="ground" x2=".8" y2="1"><stop stop-color="#173a38"/><stop offset=".55" stop-color="#22463b"/><stop offset="1" stop-color="#142d32"/></linearGradient>
    <linearGradient id="path" x2=".2" y2="1"><stop stop-color="#d0bd92"/><stop offset="1" stop-color="#a99775"/></linearGradient>
    <linearGradient id="roof-blue" x2="0" y2="1"><stop stop-color="#597992"/><stop offset=".5" stop-color="#34546c"/><stop offset="1" stop-color="#1b334b"/></linearGradient>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#a6a592"/><stop offset="1" stop-color="#627580"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#56b7c5" stop-opacity=".82"/><stop offset="1" stop-color="#152f47" stop-opacity=".9"/></linearGradient>
    <linearGradient id="roof-rust" x2="0" y2="1"><stop stop-color="#d48a62"/><stop offset=".55" stop-color="#ab5c4d"/><stop offset="1" stop-color="#6f3841"/></linearGradient>
