  <style>
    @keyframes idle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes drift { 0%,100% { transform: translateX(-8px); } 50% { transform: translateX(9px); } }
    @keyframes glow { 0%,100% { opacity: .2; } 50% { opacity: .46; } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(205px); } }
    @keyframes blink { 0%,92%,100% { opacity: 0; } 94% { opacity: 1; } 96% { opacity: 0; } }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: idle 4.1s ease-in-out infinite; }
    .teammate { animation-delay: .7s; }
    .window-clouds { transform-box: fill-box; animation: drift 28s ease-in-out infinite; }
    .screen-glow { animation: glow 3.6s ease-in-out infinite; }
    .scan-line { animation: scan 4.4s linear infinite alternate; }
    .blink { animation: blink 5.2s linear infinite; }
    .blink-late { animation-delay: 2.5s; }
    @media (prefers-reduced-motion: reduce) { .idle,.window-clouds,.screen-glow,.scan-line,.blink { animation: none !important; } }
  </style>
