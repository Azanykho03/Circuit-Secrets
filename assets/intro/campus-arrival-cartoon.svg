<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#07101d"/><stop offset=".52" stop-color="#245476"/><stop offset="1" stop-color="#91b4bd"/></linearGradient>
    <linearGradient id="building" x2="0" y2="1"><stop stop-color="#536675"/><stop offset="1" stop-color="#202d3b"/></linearGradient>
    <linearGradient id="side" x2="1" y2=".4"><stop stop-color="#151f2e"/><stop offset="1" stop-color="#344554"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#5db8db"/><stop offset=".45" stop-color="#123c5b"/><stop offset="1" stop-color="#071525"/></linearGradient>
    <linearGradient id="walk" x2="0" y2="1"><stop stop-color="#596f7b"/><stop offset="1" stop-color="#101923"/></linearGradient>
    <linearGradient id="captionShade" x2="0" y2="1"><stop stop-color="#07101d" stop-opacity="0"/><stop offset="1" stop-color="#07101d" stop-opacity=".7"/></linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="15"/><feOffset dy="16"/><feColorMatrix values="0 0 0 0 0.01 0 0 0 0 0.03 0 0 0 0 0.07 0 0 0 .65 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes drift { 0%,100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
    @keyframes rain { from { transform: translateY(-22px); opacity: .05; } 45% { opacity: .24; } to { transform: translateY(55px); opacity: .02; } }
    @keyframes reflections { 0%,100% { opacity: .2; } 50% { opacity: .44; } }
    .cloud-drift { transform-box: fill-box; animation: drift 32s ease-in-out infinite; }
    .rainfall { animation: rain 3.8s linear infinite; }
    .rainfall-delayed { animation-delay: -1.9s; }
    .wet-glints { animation: reflections 4.7s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .cloud-drift,.rainfall,.wet-glints { animation: none !important; } }
  </style>
