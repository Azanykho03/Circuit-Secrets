    <path d="M59 476h161v93H59z"/><path d="M70 486h139v56H70z" fill="#0c1722"/>
    <path d="M1220 475h258v110h-258z"/><path d="M1235 489h228v66h-228z" fill="#0c1722"/>
  </g>
  <g clip-path="url(#leftScope)" fill="none" stroke="#44b8d4" stroke-width="5" opacity=".55"><path class="scope-trace" d="M81 523h27l13-23 15 32 16-17h42"/></g>
  <g clip-path="url(#rightScope)" fill="none" stroke="#44b8d4" stroke-width="5" opacity=".55"><path class="scope-trace" d="M1250 533h56v-24h46v31h83"/></g>
  <circle class="status-led" cx="245" cy="560" r="5" fill="#ff6274"/><circle class="status-led" cx="1487" cy="573" r="5" fill="#ffb44c"/>
