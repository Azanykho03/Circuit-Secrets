  <g opacity=".7" fill="#607384"><rect x="49" y="454" width="218" height="113" rx="10"/><rect x="307" y="447" width="253" height="124" rx="10"/><rect x="1270" y="435" width="258" height="131" rx="10"/></g>
  <g fill="#091420"><rect x="65" y="469" width="185" height="76" rx="5"/><rect x="327" y="464" width="213" height="82" rx="5"/><rect x="1289" y="453" width="222" height="88" rx="5"/></g>
  <g fill="#79d9e7" opacity=".35"><rect x="88" y="491" width="68" height="6" rx="3"/><rect x="88" y="511" width="118" height="5" rx="2"/><rect x="352" y="486" width="124" height="5" rx="2"/><rect x="1313" y="478" width="141" height="5" rx="2"/></g>
  <g class="pulse-light" fill="#e0f7ff" opacity=".22" filter="url(#light)"><circle cx="350" cy="550" r="84"/><circle cx="1427" cy="536" r="91"/></g>
  <path d="M0 575h1600v325H0z" fill="url(#desk)"/>
  <path d="M0 572h1600v32H0z" fill="#718495"/>
  <path d="M300 594h910v202l-161 68H408l-108-71z" fill="url(#mat)" stroke="#6b8291" stroke-width="12" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M355 624h800v161l-125 51H430l-75-55z" fill="#1a2937" stroke="#0a111b" stroke-width="9" stroke-linejoin="round"/>
