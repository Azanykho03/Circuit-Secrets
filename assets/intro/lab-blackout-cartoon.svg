  <g fill="#091321" stroke="#34495b" stroke-width="10"><rect x="790" y="99" width="330" height="216" rx="10"/><rect x="1170" y="68" width="374" height="251" rx="10"/></g>
  <g fill="#050a12"><rect x="811" y="120" width="288" height="173" rx="6"/><rect x="1192" y="89" width="330" height="209" rx="6"/></g>
