  <path d="M137 745q88-32 164 5" fill="none" stroke="#222e3b" stroke-width="17" stroke-linecap="round"/>
  <rect width="1600" height="900" fill="url(#shade)"/>
  <rect y="588" width="1600" height="312" fill="#070e17" opacity=".26"/>
</svg>
